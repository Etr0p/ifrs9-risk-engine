[pytest]
testpaths = ifrs9_cockpit/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --smart

markers =
    slow: tests longs (standalone __main__, reproductibilite) — exclus par defaut

# Plugin smart-test : selection automatique basee sur git diff + tier @slow
# Benchmarks (32 CPUs, RTX 5070 Ti) :
#   pytest                    -> smart select, ~1 min (660 tests)
#   pytest --all -n 4         -> tous sauf @slow, parallele, ~52s (1215 tests)
#   pytest --all --slow -n 4  -> absolument tout, parallele, ~3-5 min (1225 tests)
