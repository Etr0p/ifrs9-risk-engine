[pytest]
testpaths = ifrs9_cockpit/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: tests longs (standalone __main__, reproductibilite) — exclus par defaut
    pebc: tests specifiques au modele pe-bc (5 secteurs x 2 canaux, BL-CVaR-10C)
    fourteen: tests specifiques au modele 14-couches (14 classes, BL-CVaR-14C)
    shared: tests communs aux deux modeles (pipeline, config, invariants)
